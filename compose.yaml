# LOCAL fallback only (opt-in: podman compose --profile local up -d). The live DB runs on chili:
# scripts/chili_db.sh (Slurm job) + scripts/db_tunnel.sh (laptop 127.0.0.1:3310 -> chili).
# One MariaDB for the whole project: current articles + vectors (dataset S) and the
# system-versioned edit history (dataset M) live side by side in database `wikitime`.
#   podman compose up -d        (or docker compose)
services:
  mariadb:
    image: docker.io/library/mariadb:lts   # 12.3.3 at time of setup; vectors need >= 11.7
    container_name: wikitime-db-local
    profiles: ["local"]
    environment:
      MARIADB_ROOT_PASSWORD: wikitime
      MARIADB_DATABASE: wikitime
      MARIADB_USER: wikitime
      MARIADB_PASSWORD: wikitime
    command:
      - --max-allowed-packet=256M
      - --innodb-buffer-pool-size=1G
      - --mhnsw-max-cache-size=512M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - wikitime-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
volumes:
  wikitime-data:
